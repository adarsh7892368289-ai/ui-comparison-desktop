name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Set PLAYWRIGHT_BROWSERS_PATH
        run: |
          $b = Join-Path $env:GITHUB_WORKSPACE ".playwright-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$b" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Install pinned Playwright Chromium into project path
        run: npx --no-install playwright install chromium
      - name: Package Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Set PLAYWRIGHT_BROWSERS_PATH
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.playwright-browsers" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install pinned Playwright Chromium into project path
        run: npx --no-install playwright install chromium
      - name: Package macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: release/*.dmg
